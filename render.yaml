# Render.com 무료 플랜 배포 설정. (New → Blueprint 로 이 저장소를 고르면 됩니다)
services:
  - type: web
    name: drawing-racing
    runtime: node
    plan: free
    region: singapore
    branch: claude/funny-volta-3qgbvi
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GENERATOR
        value: pregenerated
      - key: RETENTION_HOURS
        value: "24"
      # 방을 만들 때 넣는 교사 코드: 배포할 때 직접 정해서 입력합니다.
      - key: TEACHER_CODE
        sync: false
      # 관리자 비밀번호: Render 가 자동으로 만들어 줍니다 (대시보드 → Environment 에서 확인).
      - key: ADMIN_PASSWORD
        generateValue: true
      # Supabase 는 선택입니다. 두 값을 모두 넣으면 그림·3D 모델을 Supabase 에 저장합니다.
      # 비워 두면 서버 안에 저장하고, 서버가 다시 켜질 때 지워집니다.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
